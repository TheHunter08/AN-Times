name: Daily Supabase Backup

on:
  schedule:
    # Every day at 02:00 UTC (03:00 Madrid, 04:00 in summer)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}

    steps:
      # /api/backup selecciona automáticamente blob legacy o todas las tablas
      # normalizadas según el modo activo, usa service role en el servidor,
      # almacena una copia inmutable y verifica checksum + plan de restauración.
      - name: Crear y verificar backup productivo
        id: backup
        run: |
          APP_URL=$(printf '%s' "${VERCEL_APP_URL:-https://times-inc.vercel.app}" | tr -d $'\r\n\t ' | sed 's/^\xef\xbb\xbf//')
          test -n "${CRON_SECRET}"
          DATE=$(date +%Y-%m-%d)
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/backup" \
            -o "backup_result_${DATE}.json"
          echo "backup_date=$DATE" >> $GITHUB_OUTPUT

      - name: Validar evidencia de restauración
        run: |
          DATE=$(date +%Y-%m-%d)
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('backup_result_${DATE}.json','utf8')); if(!r.ok||!r.verified||!r.restorable||!r.checksum||!r.filename) throw new Error('Backup no verificable'); console.log('Backup verificado:', r.filename, r.records, 'registros, checksum', r.checksum.slice(0,12))"

      - name: Conservar comprobante de backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ steps.backup.outputs.backup_date }}
          path: backup_result_*.json
          retention-days: 90
