name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Instalar dependencias
        run: npm ci --include=dev

      - name: Verificar release completa
        run: npm run verify:deploy

      - name: Instalar navegador de pruebas
        run: npx playwright install --with-deps chromium

      - name: Verificar flujos críticos actuales
        run: npm run test:e2e:smoke

      - name: Verificar activación Auth/RLS
        run: npm run test:e2e:auth-rls
