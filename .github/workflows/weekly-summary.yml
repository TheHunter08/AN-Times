name: Resumen Semanal

on:
  # El resumen semanal forma parte de /api/cron-reminders y comparte su
  # deduplicación persistente. El disparo manual reutiliza ese endpoint seguro.
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
    steps:
      - name: Generar resumen semanal mediante el endpoint seguro
        run: |
          APP_URL=$(printf '%s' "${VERCEL_APP_URL:-https://times-inc.vercel.app}" | tr -d $'\r\n\t ')
          test -n "${CRON_SECRET}"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron-reminders"
