name: Despertar sincronización offline

on:
  # Respaldo manual. Antes lanzaba 12 jobs/hora; ahora comparte el runner
  # semihorario definido en operational-crons.yml.
  workflow_dispatch:

concurrency:
  group: times-inc-sync-ping
  cancel-in-progress: true

jobs:
  wake-service-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Despertar dispositivos con cambios pendientes
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "${CRON_SECRET}"
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 50 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://times-inc.vercel.app/api/sync-ping
