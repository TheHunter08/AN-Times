name: Supabase Keepalive

on:
  # operational-crons.yml consulta producción cada 30 minutos mediante
  # endpoints con service role. El disparo manual comprueba el endpoint de
  # salud y nunca escribe app_data con la clave anónima.
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
    steps:
      - name: Comprobar actividad y salud de Supabase
        run: |
          APP_URL=$(printf '%s' "${VERCEL_APP_URL:-https://times-inc.vercel.app}" | tr -d $'\r\n\t ')
          curl --fail-with-body --silent --show-error --max-time 90 \
            "${APP_URL}/api/health"
