name: Auto-cierre jornadas >10h

on:
  # Respaldo manual. La programación vive en operational-crons.yml y llama al
  # endpoint de Vercel para no instalar dependencias en cada ejecución.
  workflow_dispatch:

concurrency:
  group: autoclose-jornada
  cancel-in-progress: false

jobs:
  autoclose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm install web-push --no-save
      - name: Cerrar jornadas abiertas >10h
        run: node push-autoclose-jornada.js
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VITE_SB_URL: ${{ secrets.VITE_SB_URL }}
          VITE_SB_ANON: ${{ secrets.VITE_SB_ANON }}
          SB_SERVICE_KEY: ${{ secrets.SB_SERVICE_KEY }}
