name: Anomaly Detector – Jornadas sin cerrar

on:
  # Sustituido por operational-crons.yml -> /api/cron-autoclose, que usa
  # service role y tablas normalizadas. El disparo manual reutiliza el mismo
  # endpoint seguro en vez del antiguo lector anónimo de app_data.
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
    steps:
      - name: Detectar y cerrar jornadas largas mediante el endpoint seguro
        run: |
          APP_URL=$(printf '%s' "${VERCEL_APP_URL:-https://times-inc.vercel.app}" | tr -d $'\r\n\t ')
          test -n "${CRON_SECRET}"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron-autoclose"
